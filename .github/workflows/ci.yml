name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pc-tests:
    name: PC tests (no board needed)
    runs-on: ubuntu-latest
    env:
      # Fix the RNG seed: the smoke test drives the real state machine, so the
      # minesweeper layout / snake food positions must be reproducible. Without
      # this, a failing run cannot be reproduced locally (that is how the
      # minesweeper stack-smash bug stayed hidden).
      ALBUM_SEED: "20261025"
    steps:
      - uses: actions/checkout@v4

      - name: Compiler info
        run: gcc --version | head -1

      - name: Install a CJK font (the asset pipeline renders Chinese labels)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list | grep -ci noto

      - name: Unit tests (2048 rules + touch autodetect)
        run: make -C test unit

      - name: Install Pillow and regenerate all art assets
        run: |
          python3 -m pip install --quiet pillow
          make assets PYTHON=python3

      - name: Verify generated asset count
        run: |
          n=$(find bmp -name '*.bmp' | wc -l)
          echo "generated BMP files: $n"
          test "$n" -ge 150

      - name: Full-app smoke test (46 scripted touches, real state machine)
        run: make -C test run

      # A pinned seed keeps failures reproducible but only ever exercises one
      # layout. This second run uses a seed derived from the run number, so every
      # push sees a fresh minesweeper/snake/2048 layout (the stack-smash bug was
      # layout dependent and would have been caught here months earlier).
      - name: Full-app smoke test (second layout, seed changes every run)
        env:
          ALBUM_SEED: ${{ github.run_number }}${{ github.run_attempt }}
        run: make -C test run
